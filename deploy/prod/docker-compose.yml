# REFERENCE COPY. Not applied automatically.
# The live file is ~/services/riftworks/docker-compose.yml on the server.
# To change the server: edit it there, run `docker compose up -d`, then update this copy in a PR.

services:
  bot:
    image: ghcr.io/realephemeraleuphoria/riftworks-bot:latest
    container_name: riftworks-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18080:8080"
    labels:
      # Opt in to updates, but only from the updater with the same scope.
      # https://github.com/nicholas-fedor/watchtower/blob/main/docs/configuration/container-selection/index.md
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=riftworks

  updater:
    # Maintained fork of Watchtower (the original was archived in Dec 2025). Pinned.
    # https://github.com/nicholas-fedor/watchtower
    image: nickfedor/watchtower:1.24.0
    container_name: riftworks-updater
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      WATCHTOWER_SCOPE: riftworks
      WATCHTOWER_POLL_INTERVAL: "120"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: riftworks
      # https://github.com/nicholas-fedor/watchtower/blob/main/docs/configuration/notifications/index.md
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - com.centurylinklabs.watchtower.scope=riftworks
