# Workflow syntax (name, on, env, jobs, needs, outputs, environment):
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: bot publish

# Runs after a merge to main that changes bot/. See "on.push.branches" and "on.<event>.paths".
on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/bot-publish.yml"

# Workflow-wide variable, used as ${{ env.IMAGE }}. See "env" in the workflow syntax page.
# The image's address in GitHub's container registry (must be lowercase):
# https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry
env:
  IMAGE: ghcr.io/realephemeraleuphoria/riftworks-bot

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: dev
    # GITHUB_TOKEN may read code and upload packages.
    # https://docs.github.com/en/actions/concepts/security/github_token
    permissions:
      contents: read
      packages: write
    # Passes the built image's digest to the prod job. See "jobs.<job_id>.outputs".
    # Values like ${{ steps.build.outputs.digest }} are contexts:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Signs in to ghcr.io with the run's GITHUB_TOKEN.
      # https://github.com/docker/login-action
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image tags: dev, and sha-<short commit>.
      # https://github.com/docker/metadata-action
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha

      # https://github.com/docker/setup-buildx-action
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds bot/ and uploads it with those tags.
      # https://github.com/docker/build-push-action
      # cache-from / cache-to reuse layers between runs:
      # https://docs.docker.com/build/cache/backends/gha/
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bot
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Posts to this environment's #dev-log. DEPLOY_WEBHOOK comes from the
      # job's environment (dev or prod), so the same step goes to different servers.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets
      # &notify-discord labels this step so prod can reuse it (YAML anchor):
      # https://github.blog/changelog/2025-09-18-actions-yaml-anchors-and-non-public-workflow-templates/
      - &notify-discord
        name: Tell Discord
        env:
          WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
          ENVIRONMENT: ${{ github.job }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          curl -fsS -H "Content-Type: application/json" \
            -d "{\"content\": \"**${ENVIRONMENT}** now has \`sha-${GITHUB_SHA::7}\` ([commit](${COMMIT_URL}))\"}" \
            "$WEBHOOK"

  prod:
    # Waits for the dev job. See "jobs.<job_id>.needs".
    needs: dev
    runs-on: ubuntu-latest
    # This should pause until a required reviewer approves. Reviewers are pulled from the repo's Environments settings.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments
    # https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      # https://github.com/docker/login-action
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/setup-buildx-action
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Adds the "latest" tag to the exact image dev ran, by digest. Nothing is rebuilt.
      # https://docs.docker.com/reference/cli/docker/buildx/imagetools/create/
      - name: Promote the dev image to latest
        run: docker buildx imagetools create -t ${{ env.IMAGE }}:latest ${{ env.IMAGE }}@${{ needs.dev.outputs.digest }}

      # Same notify step as dev (YAML anchor), posting to prod's #dev-log.
      - *notify-discord
